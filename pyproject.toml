[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-design"
dynamic = ["version"]
description = "Cockpit graphique et outils visuels pour l'écosystème Forge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
forge-design = "forge_design.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "pyright>=1.1.390"]

[tool.setuptools]
packages = ["forge_design"]

[tool.setuptools.dynamic]
version = {attr = "forge_design.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["forge_design", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
