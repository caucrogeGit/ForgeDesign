[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-design"
dynamic = ["version"]
description = "Cockpit graphique et outils visuels pour l'écosystème Forge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["packaging>=24.0", "forge-mvc==1.0.0rc9", "jinja2==3.1.6"]

[project.scripts]
forge-design = "forge_design.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "pyright>=1.1.390"]

[tool.setuptools]
packages = ["forge_design", "forge_design.forge", "forge_design.tools", "forge_design.platform", "forge_design.web"]

[tool.setuptools.package-data]
"forge_design.web" = ["templates/routes.html", "templates/source.html", "templates/layout.html", "templates/index.html", "templates/inspector.html", "static/shell.css", "static/route-graph.js"]

[tool.setuptools.dynamic]
version = {attr = "forge_design.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["forge_design", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
