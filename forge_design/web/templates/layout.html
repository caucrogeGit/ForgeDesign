<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Forge Design{% endblock %}</title>
  <link rel="stylesheet" href="/shell.css">
</head>
<body>
  <header>
    <p class="brand">Forge Design</p>
    <nav aria-label="Navigation principale">
      <a href="/"{% if active_page == 'home' %} aria-current="page"{% endif %}>Accueil</a>
      <a href="/inspector"{% if active_page == 'inspector' %} aria-current="page"{% endif %}>Project Inspector</a>
      <a href="/routes"{% if active_page == 'routes' %} aria-current="page"{% endif %}>Route Explorer</a>
    </nav>
    <div class="current-project">
      {% if current_project %}
      <p>Projet : {{ current_project.root }}</p>
      {% if current_project.forge_version %}<p>Forge {{ current_project.forge_version }}</p>{% endif %}
      <form action="/project/refresh" method="post">
        <button type="submit">Actualiser</button>
      </form>
      <form action="/project/close" method="post">
        <button type="submit">Fermer le projet</button>
      </form>
      {% else %}<p>Aucun projet ouvert.</p>{% endif %}
    </div>
  </header>
  <main>
{% block content %}{% endblock %}
  </main>
</body>
</html>
