<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forge Design</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #23312e; background: #f6f5f0; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { padding: 1.5rem clamp(1.5rem, 6vw, 5rem); border-bottom: 1px solid #dcded5; }
    .brand { margin: 0; font-weight: 650; letter-spacing: -.03em; }
    .brand::before { content: ""; display: inline-block; width: .65rem; height: .65rem; margin-right: .65rem; background: #b64c29; }
    main { max-width: 56rem; margin: 0 auto; padding: clamp(4rem, 12vh, 8rem) 1.5rem; }
    .eyebrow { color: #765340; font-size: .75rem; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; }
    h1 { font-size: clamp(2.5rem, 7vw, 4.5rem); font-weight: 550; letter-spacing: -.055em; line-height: 1.1; margin: 1rem 0; }
    .intro { max-width: 36rem; color: #53615b; font-size: 1.15rem; line-height: 1.7; }
    section { margin-top: 3rem; padding: 1.5rem; border: 1px solid #dcded5; border-radius: .5rem; background: #fdfcf9; }
    h2 { margin: 0 0 .65rem; color: #53615b; font-size: .85rem; font-weight: 500; }
    section p { margin: 0; font-size: 1.05rem; }
  </style>
</head>
<body>
  <header><p class="brand">Forge Design</p></header>
  <main>
    <p class="eyebrow">Espace de travail</p>
    <h1>Forge Design</h1>
    <p class="intro">Cockpit graphique et plateforme d’outils visuels pour Forge.</p>
    <section aria-labelledby="project-state">
      <h2 id="project-state">État du projet</h2>
      <p>Aucun projet ouvert.</p>
    </section>
  </main>
</body>
</html>
